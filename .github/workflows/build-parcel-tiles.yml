name: Build parcel tiles

# Rebuilds the statewide land-owner vector tiles (pa-parcels.pmtiles) that the
# "Land Owners" map overlay renders, uploads them to Cloudflare R2 (the bucket
# the app streams from), and also keeps a copy on the `parcel-tiles` GitHub
# Release as a versioned backup. tippecanoe only runs on Linux, so this is the
# supported way to regenerate the archive (it can't be built on Windows).
#
# Runs monthly (06:00 UTC on the 1st) to refresh the data as county parcels
# change, and can also be dispatched manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Publish even if the new archive is much smaller than the live one"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month

permissions:
  # Uploading the release asset needs contents: write.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      # Owner history: last build's per-county owner snapshots live in the same
      # R2 bucket under parcel-history/. The build compares against them to
      # mark parcels that changed hands, then writes fresh snapshots that are
      # uploaded only once the tiles publish. None yet (first run) = no marks.
      - name: Fetch last build's owner snapshots
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: deer-intel-tiles
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/parcel-history"
          if ! aws s3 sync "s3://${R2_BUCKET}/parcel-history/" "$RUNNER_TEMP/parcel-history/" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors; then
            echo "::warning title=Owner history unavailable::Couldn't read parcel-history/ from R2; this build marks no owner changes."
          fi
          echo "Snapshots: $(ls "$RUNNER_TEMP/parcel-history" | wc -l)"

      - name: Build parcel tiles
        working-directory: deer-intel-v2
        env:
          # No proxy on GitHub runners; fetch the county services directly.
          NODE_USE_ENV_PROXY: "0"
          PARCEL_HISTORY_IN: ${{ runner.temp }}/parcel-history
          PARCEL_HISTORY_OUT: ${{ runner.temp }}/parcel-history-next
        run: bash scripts/build-parcel-tiles.sh

      - name: Publish tiles to R2 (live) and the release (backup)
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 adds default integrity checksums R2 rejects; scope them.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: deer-intel-tiles
        run: |
          set -euo pipefail
          file="deer-intel-v2/public/data/pa-parcels.pmtiles"
          if [ ! -s "$file" ]; then
            echo "ERROR: $file missing or empty — build produced no tiles." >&2
            exit 1
          fi
          size="$(du -h "$file" | cut -f1)"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Guard: a county that failed every retry is left out of the build.
          # Refuse to replace the live archive with one that lost a big chunk,
          # so one flaky county server can't blank its land owners for a month.
          new_bytes="$(stat -c %s "$file")"
          live_bytes="$(aws s3api head-object --bucket "$R2_BUCKET" --key pa-parcels.pmtiles \
            --endpoint-url "$endpoint" --query ContentLength --output text 2>/dev/null || echo 0)"
          if [ "${live_bytes:-0}" -gt 0 ] && [ "$new_bytes" -lt $(( live_bytes * 85 / 100 )) ] \
             && [ "${{ inputs.allow_shrink || false }}" != "true" ]; then
            echo "::error title=Parcel tiles shrank::New archive is ${new_bytes} bytes vs ${live_bytes} live (over 15% smaller). Not publishing. Check the skipped-county warnings, or re-run with allow_shrink."
            exit 1
          fi

          # Primary: upload to the R2 bucket the app streams from (CORS + range).
          aws s3 cp "$file" "s3://${R2_BUCKET}/pa-parcels.pmtiles" \
            --endpoint-url "$endpoint" \
            --content-type application/octet-stream

          # Owner snapshots for next month's comparison — only now that the
          # tiles they describe are live. A county skipped this run kept its
          # previous snapshot (build-parcel-tiles.sh copies it forward).
          # Non-fatal: the tiles are already live; a missed upload only means
          # next month compares against an older snapshot.
          aws s3 cp "$RUNNER_TEMP/parcel-history-next/" "s3://${R2_BUCKET}/parcel-history/" \
            --recursive --endpoint-url "$endpoint" \
            --content-type application/gzip --only-show-errors \
            || echo "::warning title=Owner history not saved::Couldn't upload parcel-history/ snapshots to R2."

          # Backup: keep a versioned copy on the GitHub Release.
          gh release upload parcel-tiles "$file" --clobber --repo "${{ github.repository }}"

          {
            echo "## Parcel tiles refreshed (${size})"
            echo ""
            echo "Uploaded to R2 (\`${R2_BUCKET}/pa-parcels.pmtiles\`, live) and the \`parcel-tiles\` release (backup)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published ${size} to R2 + release"
